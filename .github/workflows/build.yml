name: Build Paperline

on:
  push:
    tags:
      - 'v*'
      - 'V*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    outputs:
      signed: ${{ steps.signing.outputs.enabled }}
    defaults:
      run:
        working-directory: Paperline
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate release version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -cne "v$version" -and $env:GITHUB_REF_NAME -cne "V$version") {
            throw "Tag must match package.json version: v$version or V$version"
          }
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Paperline/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Check JavaScript
        run: npm run check
      - name: Detect Windows signing credentials
        id: signing
        shell: pwsh
        env:
          WIN_CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
        run: |
          $hasCertificate = -not [string]::IsNullOrWhiteSpace($env:WIN_CSC_LINK)
          $hasPassword = -not [string]::IsNullOrWhiteSpace($env:WIN_CSC_KEY_PASSWORD)
          if ($hasCertificate -ne $hasPassword) {
            throw 'Signing configuration is incomplete. Set both WINDOWS_CSC_LINK and WINDOWS_CSC_KEY_PASSWORD, or remove both for an unsigned test build.'
          }
          if ($hasCertificate) {
            'enabled=true' >> $env:GITHUB_OUTPUT
            'Windows installer: signed; signature verification required.' >> $env:GITHUB_STEP_SUMMARY
          } else {
            'enabled=false' >> $env:GITHUB_OUTPUT
            'Windows installer: unsigned test build. Windows may display an unknown publisher warning.' >> $env:GITHUB_STEP_SUMMARY
          }
      - name: Build signed Windows installer
        if: steps.signing.outputs.enabled == 'true'
        env:
          WIN_CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
        run: npm run dist:win -- --x64 --publish never -c.forceCodeSigning=true
      - name: Build unsigned Windows test installer
        if: steps.signing.outputs.enabled == 'false'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist:win -- --x64 --publish never -c.forceCodeSigning=false
      - name: Verify installer signature
        if: steps.signing.outputs.enabled == 'true'
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem release/*Setup*.exe)
          if ($installers.Count -eq 0) { throw 'No Windows installer found.' }
          foreach ($installer in $installers) {
            $signature = Get-AuthenticodeSignature -LiteralPath $installer.FullName
            if ($signature.Status -ne 'Valid') {
              throw "Invalid installer signature: $($installer.Name) ($($signature.Status))"
            }
          }
      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Paperline-Windows
          path: Paperline/release/*Setup*.exe
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: Paperline
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Paperline/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Build macOS installers
        run: npm run dist:mac -- --publish never
      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Paperline-macOS
          path: Paperline/release/*.dmg
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          WINDOWS_SIGNED: ${{ needs.windows.outputs.signed }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$WINDOWS_SIGNED" = 'true' ]; then
            printf '%s\n' 'Windows: digitally signed installer.' > release-notes.md
          else
            printf '%s\n' 'Windows: unsigned test installer. Windows may display an unknown publisher warning.' > release-notes.md
          fi
          printf '\n%s\n' 'macOS: unsigned and not notarized. Successful DMG creation does not guarantee Gatekeeper acceptance.' >> release-notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release/* --clobber
          else
            gh release create "$TAG" release/* --verify-tag --title "Paperline $TAG" --notes-file release-notes.md --generate-notes
          fi
